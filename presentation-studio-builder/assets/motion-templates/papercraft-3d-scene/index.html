  for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2 + 0.3, leg = limb([-1.1, -4.5, 5.3], [-1.1 + Math.cos(a) * 2.3, -5.7, 5.3 + Math.sin(a) * 2.3], 0.28, mIndD); leg.castShadow = true; chair.add(leg); const w = add(chair, new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.25, 8), mKr), -1.1 + Math.cos(a) * 2.3, -5.95, 5.3 + Math.sin(a) * 2.3); w.rotation.z = Math.PI / 2; }

  /* ---------- o desenvolvedor: recortes de papel em camadas, visto de costas ---------- */
  const dev = new THREE.Group(); dev.position.set(-2.0, 0, 5.4); dev.scale.setScalar(0.88); scene.add(dev);
  const hoodie = paper(C.indigoLite, { rep: 1.5 }), hoodieD = paper(0x2C3190, { rep: 1.5 }), hair = paper(0x1B1D58), skin = paper(0xD9A774), verBand = paper(C.vermil);
  add(dev, edge(ext((s) => { s.moveTo(-1.55, 0); s.lineTo(-1.7, 1.9); s.quadraticCurveTo(-1.6, 2.55, -0.9, 2.7); s.lineTo(0.9, 2.7); s.quadraticCurveTo(1.6, 2.55, 1.7, 1.9); s.lineTo(1.55, 0); s.closePath(); }, 0.55, hoodie)), 0, 1.0, -0.2);
  add(dev, edge(ext((s) => { s.moveTo(-1.1, 0); s.quadraticCurveTo(-1.5, 1.2, -0.85, 2.0); s.quadraticCurveTo(0, 2.5, 0.85, 2.0); s.quadraticCurveTo(1.5, 1.2, 1.1, 0); s.closePath(); }, 0.22, hoodieD)), 0, 1.7, 0.36);   // capuz
  add(dev, box(0.6, 0.7, 0.4, skin), 0, 3.55, 0.05);                                                    // pescoço
  add(dev, edge(ext((s) => { s.absellipse(0, 0, 0.78, 0.86, 0, Math.PI * 2, false); }, 0.5, hair)), 0, 4.3, -0.15);   // cabeça (cabelo, camada base)
  add(dev, edge(ext((s) => { s.moveTo(-0.7, -0.1); s.quadraticCurveTo(-0.85, 0.7, -0.1, 0.84); s.quadraticCurveTo(0.7, 0.8, 0.72, -0.05); s.quadraticCurveTo(0.2, 0.35, -0.7, -0.1); }, 0.12, paper(0x2A2D86))), 0, 4.35, 0.32);  // mecha superior
  add(dev, edge(ext((s) => { s.moveTo(-0.55, 0); s.quadraticCurveTo(-0.62, -0.62, 0, -0.66); s.quadraticCurveTo(0.62, -0.62, 0.55, 0); s.closePath(); }, 0.1, paper(0x14164A))), 0, 3.95, 0.34); // nuca
  [-1, 1].forEach((sd) => { add(dev, box(0.2, 0.46, 0.12, skin), sd * 0.82, 4.15, 0.1); const cup = add(dev, new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.26, 12), verBand), sd * 0.95, 4.2, 0.12); cup.rotation.z = Math.PI / 2; });
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.07, 6, 24, Math.PI), verBand); band.position.set(0, 4.2, 0.13); band.castShadow = true; dev.add(band);
  [-1, 1].forEach((sd) => { // braços até o teclado
    const sh = [sd * 1.5, 2.9, -0.1], el = [sd * 1.9, 1.7, -1.9], hd = [sd * 0.8, 0.6, -3.1];
    dev.add(Object.assign(limb(sh, el, 0.62, hoodie), { castShadow: true })); dev.add(Object.assign(limb(el, hd, 0.52, hoodieD), { castShadow: true }));
    add(dev, edge(box(0.62, 0.22, 0.7, skin)), hd[0], hd[1] - 0.05, hd[2] - 0.35); });

  /* ---------- câmera: sobre o ombro → direto ao centro da tela → preto ---------- */
  const S = { px: 3.4, py: 5.8, pz: 15.5, tx: -0.2, ty: 3.0, tz: 0, fov: 31, roll: 0.0, dim: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(S, { px: 3.0, py: 5.5, pz: 13.6, fov: 31, duration: 1.5, ease: "sine.out" }, 0)
    .to(S, { px: 0.2, py: 3.3, pz: 0.9, tx: 0, ty: 3.25, fov: 52, roll: -0.025, duration: 3.8, ease: "power2.in" }, 1.4)
    .to(S, { pz: 0.28, fov: 58, duration: 0.7, ease: "power1.out" }, 5.2)
    .to(S, { dim: 1, duration: 0.9, ease: "power2.in" }, 5.2)
    .to({}, { duration: 0.001 }, DUR);
  const black = document.getElementById("black");

  function frame() {
    const t = tl.time();
    camera.position.set(S.px, S.py, S.pz); camera.fov = S.fov; camera.updateProjectionMatrix(); camera.lookAt(S.tx, S.ty, S.tz); camera.rotation.z += S.roll;
    const pulse = 0.5 + 0.5 * Math.sin(t * 6.2), fl = 0.9 + 0.1 * Math.sin(t * 23) * Math.sin(t * 7.1);
    alerts.forEach((i, k) => { const p = 0.5 + 0.5 * Math.sin(t * 6.2 + k * 1.3); tmpC.copy(base).lerp(hot, p); lineMesh.setColorAt(i, tmpC); }); lineMesh.instanceColor.needsUpdate = true;
    flags.forEach((f, i) => { const p = 0.5 + 0.5 * Math.sin(t * 6.2 + i * 1.7); f.scale.setScalar(0.92 + 0.22 * p); f.rotation.z = Math.sin(t * 3 + i) * 0.08; });
    const k = 1 - S.dim; glowR.intensity = (1.7 + 1.0 * pulse) * fl * k; glowI.intensity = 1.6 * k; glowSpr.material.opacity = (0.22 + 0.2 * pulse) * k;
    key.intensity = 1.7 * k; rim.intensity = 0.9 * k; hemi.intensity = 0.55 * k; lamp.intensity = 9 * k;
    scene.background.setRGB(0.043 * k, 0.039 * k, 0.149 * k);
    dev.rotation.z = Math.sin(t * 0.9) * 0.012; dev.children[3].rotation.z = 0; // respiração sutil
    black.style.opacity = String(clamp((t - 5.7) / 0.5));
    renderer.render(scene, camera);
  }
  const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; frame(); };
  addEventListener("resize", resize);
  const bar = document.getElementById("bar"), tm = document.getElementById("tm"), btn = document.getElementById("play"); let playing = true;
  gsap.ticker.add(() => { if (!playing) return; let t = tl.time() + gsap.ticker.deltaRatio() / 60; if (t >= DUR + 0.8) t = 0; tl.time(Math.min(t, DUR)); frame(); bar.value = (Math.min(t, DUR) / DUR) * 1000; tm.textContent = Math.min(t, DUR).toFixed(1) + " s"; });
  bar.addEventListener("input", () => { playing = false; btn.textContent = "▶ Reproduzir"; tl.time((bar.value / 1000) * DUR); frame(); tm.textContent = tl.time().toFixed(1) + " s"; });
  btn.addEventListener("click", () => { playing = !playing; btn.textContent = playing ? "⏸ Pausar" : "▶ Reproduzir"; });
  if (/clean/.test(location.search)) document.body.classList.add("clean");
  // grão de papel (textura de ruído) como overlay
  document.getElementById("grain").style.backgroundImage = `url(${cv(256, 256, (g, w, h) => { const im = g.createImageData(w, h); for (let i = 0; i < im.data.length; i += 4) { const v = 110 + rnd() * 70; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); }).toDataURL()})`;
  window.__sw = { set: (p) => { playing = false; tl.time(p * DUR); frame(); } };
  resize(); tl.time(0); frame();
})();
</script>
