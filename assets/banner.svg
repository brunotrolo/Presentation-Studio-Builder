<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640" role="img" aria-label="Presentation Studio Builder">
  <defs>
    <radialGradient id="glow" cx="82%" cy="-10%" r="80%">
      <stop offset="0" stop-color="#4B3BFF" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#0A1A6B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#00B8D9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B8D9"/>
      <stop offset="1" stop-color="#9DB8FF"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#00B8D9" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1920" height="640" fill="#02030F"/>
  <rect width="1920" height="640" fill="url(#glow)"/>
  <rect width="1920" height="640" fill="url(#grid)"/>

  <!-- feixe de luz: a linha que atravessa os slides -->
  <path d="M0 520 H1500 Q1560 520 1560 460 V300" fill="none" stroke="#00B8D9" stroke-width="10" stroke-opacity="0.45" filter="url(#soft)"/>
  <path d="M0 520 H1500 Q1560 520 1560 460 V300" fill="none" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1560" cy="300" r="12" fill="#FFFFFF"/>

  <!-- slides empilhados -->
  <g transform="translate(1250 90)">
    <rect x="60" y="40" width="460" height="260" rx="8" fill="#0A1A6B" stroke="#9DB8FF" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="30" y="20" width="460" height="260" rx="8" fill="#12238A" stroke="#9DB8FF" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="260" rx="8" fill="#F5F6F8"/>
    <rect x="28" y="30" width="150" height="10" rx="3" fill="#2D5BFF"/>
    <rect x="28" y="56" width="300" height="26" rx="4" fill="#0B1020"/>
    <rect x="28" y="92" width="230" height="26" rx="4" fill="#FF7A45"/>
    <rect x="28" y="150" width="120" height="70" rx="4" fill="none" stroke="#0B1020" stroke-width="3"/>
    <rect x="164" y="150" width="120" height="70" rx="4" fill="none" stroke="#0B1020" stroke-width="3"/>
    <rect x="300" y="150" width="120" height="70" rx="4" fill="none" stroke="#0B1020" stroke-width="3"/>
    <g transform="translate(332 24) rotate(-6)"><rect width="104" height="34" rx="4" fill="#22C55E" stroke="#0B1020" stroke-width="3" stroke-dasharray="6 4"/><rect x="14" y="13" width="76" height="8" rx="2" fill="#0B1020"/></g>
  </g>

  <text x="120" y="250" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="8" fill="#00B8D9">SKILL PARA CLAUDE CODE</text>
  <text x="120" y="340" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#FFFFFF">Presentation</text>
  <text x="120" y="440" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#FFFFFF">Studio <tspan fill="#FF7A45">Builder</tspan></text>
  <text x="120" y="500" font-family="JetBrains Mono, Consolas, monospace" font-size="26" fill="#A9B2C7">briefing  →  slides animados  →  Studio  →  motion cinematográfico</text>
</svg>
